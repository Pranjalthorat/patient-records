{% extends "base.html" %}
{% block title %}Delete patient - Patient Records{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Delete this record?</h1>
  <p><strong>{{ patient.full_name }}</strong> ({{ patient.email }}) will be removed permanently. This cannot be undone.</p>
  <form method="post" class="form-actions">
    <button type="submit" class="button danger-solid">Delete record</button>
    <a class="button ghost" href="{{ url_for('index') }}">Cancel</a>
  </form>
</section>
{% endblock %}
